name: Continuous Training

on:
  push:
    branches: ["main"]

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The dataset is tracked by DVC but no DVC remote is configured,
      # so `dvc pull` cannot restore it here. Download the public source
      # instead, the same way the cml_report job in ci.yml does.
      - name: Download raw data
        run: |
          mkdir -p data/raw
          curl -o data/raw/winequality-red.csv https://archive.ics.uci.edu/ml/machine-learning-databases/wine-quality/winequality-red.csv
          sed -i 's/;/,/g' data/raw/winequality-red.csv

      # Runs the same steps as dvc.yaml, without DVC: this environment is
      # disposable, so there is nowhere to store the DVC outputs.
      - name: Run training pipeline
        run: |
          python src/preprocessing.py
          python src/train.py
